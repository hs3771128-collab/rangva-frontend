[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Render service URL + /api is added by the app. Change this if your Render
  # URL is different (Render appends a suffix when the name is taken).
  VITE_BACK_END_URL = "https://rangva-api.onrender.com"

# React Router: let the SPA handle client-side routes such as /track-order.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
